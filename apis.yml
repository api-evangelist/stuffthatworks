aid: stuffthatworks
name: StuffThatWorks
description: 'StuffThatWorks is a community-driven health research platform where patients
  with chronic conditions share their real-world experiences to figure out, together,
  which treatments work best. Members complete structured surveys about their diagnoses,
  symptoms, and treatment outcomes, and the platform applies collective-intelligence
  and machine-learning models to turn thousands of patient reports into comparative,
  condition-by-condition treatment rankings across hundreds of chronic illnesses such
  as fibromyalgia, IBS, migraine, PCOS, and endometriosis. Founded in 2018 and headquartered
  in Tel Aviv, StuffThatWorks is backed by Bessemer Venture Partners. The consumer product
  is delivered as a web and mobile (PWA / Capacitor) application; probing the public
  domain surfaced no public developer API, SDK, OpenAPI, or developer portal at this
  time — only the SPA''s private backend under /api/.'
